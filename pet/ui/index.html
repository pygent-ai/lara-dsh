<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lara Pet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="conversation-stack">
        <div id="bubble" class="hidden">
          <div id="bubble-text"></div>
          <div id="bubble-attachments" class="hidden"></div>
          <button id="bubble-panel" title="聊天面板">💬</button>
          <button id="bubble-close" title="关掉这条">×</button>
        </div>
        <div id="pending-message" class="chat-msg user hidden" aria-live="polite">
          <span id="pending-message-text"></span>
        </div>
        <div id="input-bar" class="hidden">
          <textarea
            id="chat-input"
            rows="1"
            autocomplete="off"
            spellcheck="false"
            aria-label="跟兔兔说话"
            placeholder="Shift+Enter 换行"
          ></textarea>
          <button id="input-to-panel" title="切换到聊天面板">💬</button>
        </div>
      </div>

      <div id="chat-panel" class="hidden">
        <div id="chat-history"></div>
        <button id="new-message-indicator" class="hidden" type="button">↓ 新消息</button>
        <div class="chat-row">
          <textarea id="panel-input" rows="1" autocomplete="off" spellcheck="false" placeholder="Shift+Enter 换行"></textarea>
          <button id="panel-to-input" title="切换到输入条">⌨</button>
          <button id="panel-collapse" title="收起面板">▾</button>
        </div>
      </div>

      <div id="settings-panel" class="hidden">
        <h3>桌宠设置</h3>
        <label>触发键 <select id="set-key">
          <option value="shift">Shift</option>
          <option value="ctrl">Ctrl</option>
          <option value="alt">Alt</option>
          <option value="grave">`</option>
          <option value="capslock">CapsLock</option>
        </select></label>
        <label>连击次数 <select id="set-taps">
          <option value="2">双击</option>
          <option value="3">三击</option>
        </select></label>
        <label>窗口 <select id="set-window">
          <option value="500">宽松 0.5s</option>
          <option value="800">标准 0.8s</option>
          <option value="1200">迟缓 1.2s</option>
        </select></label>
        <label>皮肤 <select id="set-skin"></select></label>
        <button id="settings-close">完成</button>
      </div>

      <div id="unread-dot" class="hidden" title="有未读消息">1</div>
      <!-- 聊天面板打开时贴窗口边缘的隐形缩放把手；按下交给系统原生 resize 循环 -->
      <div id="resize-handles">
        <div class="rh rh-n" data-dir="North"></div>
        <div class="rh rh-nw" data-dir="NorthWest"></div>
        <div class="rh rh-ne" data-dir="NorthEast"></div>
        <div class="rh rh-w" data-dir="West"></div>
        <div class="rh rh-e" data-dir="East"></div>
      </div>
      <canvas id="pet" width="32" height="32"></canvas>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
