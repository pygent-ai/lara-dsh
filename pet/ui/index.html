<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lara Pet</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="input-bar" class="hidden">
        <input
          id="chat-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="跟兔兔说点什么…（Enter 发送 · Esc 关闭）"
        />
      </div>
      <div id="bubble" class="hidden">
        <div id="bubble-text"></div>
        <button id="bubble-close" title="关掉这条">×</button>
      </div>
      <canvas id="pet" width="32" height="32"></canvas>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
