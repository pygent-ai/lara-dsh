[project]
name = "lara"
version = "0.0.1"
description = "Lara — a standalone agent implementation: the complete agent runtime extracted from the lara project"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "deepseek-harness-runtime-bin==0.2.2rc2",
    "deepseek-harness-sdk==0.2.2rc2",
    "pygent-ai[video]==0.6.10",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
]
credentials = [
    "keyring>=25.0.0",
]

[project.scripts]
lara = "lara_shell.ops.cli.main:main"
lara-pet-sidecar = "lara_pet.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lara_shell", "src/lara_sdk", "src/lara_pet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: end-to-end functional-anchor scenario (real runtime, scripted model)",
]

[tool.pyright]
include = ["src/lara_sdk", "src/lara_shell", "src/lara_pet", "tests", "examples"]
